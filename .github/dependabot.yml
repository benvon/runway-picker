version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Majors stay ungrouped so one incompatible major cannot fail the weekly patch and minor updates.
      # @vitest/coverage-v8 peers an exact vitest version, so those majors have to land in one pull request.
      vitest-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - vitest
          - "@vitest/*"
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
    ignore:
      # TypeScript 7 has no JavaScript API. The compiler is @typescript/native;
      # the typescript alias stays on @typescript/typescript6 for typescript-eslint.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions-all:
        patterns:
          - "*"
