name: Production Deployment Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify production deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          AIRPORT_IO_TOKEN: ${{ secrets.AIRPORT_IO_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PROJECT_NAME AIRPORT_IO_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "$name: missing"
              missing=1
            else
              echo "$name: present"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
