name: Release Create

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  create-release:
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      release_tag: ${{ steps.plan.outputs.next_tag }}
      release_sha: ${{ github.event.workflow_run.head_sha }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Detect latest semver tag
        id: latest
        shell: bash
        run: |
          latest_tag="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Compute release plan
        id: plan
        env:
          CURRENT_TAG: ${{ steps.latest.outputs.latest_tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          node scripts/release-version.js --current-tag "$CURRENT_TAG" --to-ref "$HEAD_SHA" > release-plan.json

          should_release="$(node -e "const fs=require('node:fs'); const plan=JSON.parse(fs.readFileSync('release-plan.json','utf8')); process.stdout.write(String(plan.shouldRelease));")"
          next_tag="$(node -e "const fs=require('node:fs'); const plan=JSON.parse(fs.readFileSync('release-plan.json','utf8')); process.stdout.write(plan.nextTag ?? '');")"
          bump_type="$(node -e "const fs=require('node:fs'); const plan=JSON.parse(fs.readFileSync('release-plan.json','utf8')); process.stdout.write(plan.bumpType ?? '');")"
          analyzed_count="$(node -e "const fs=require('node:fs'); const plan=JSON.parse(fs.readFileSync('release-plan.json','utf8')); process.stdout.write(String(plan.analyzedCommitCount ?? 0));")"

          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "bump_type=$bump_type" >> "$GITHUB_OUTPUT"
          echo "analyzed_count=$analyzed_count" >> "$GITHUB_OUTPUT"

      - name: Write release summary
        shell: bash
        env:
          CURRENT_TAG: ${{ steps.latest.outputs.latest_tag }}
          SHOULD_RELEASE: ${{ steps.plan.outputs.should_release }}
          NEXT_TAG: ${{ steps.plan.outputs.next_tag }}
          BUMP_TYPE: ${{ steps.plan.outputs.bump_type }}
          ANALYZED_COUNT: ${{ steps.plan.outputs.analyzed_count }}
        run: |
          if [ "$SHOULD_RELEASE" = "true" ]; then
            {
              echo "## Release Plan"
              echo ""
              echo "- Previous tag: ${CURRENT_TAG:-v0.0.0}"
              echo "- Next tag: $NEXT_TAG"
              echo "- Bump: $BUMP_TYPE"
              echo "- Commits analyzed: $ANALYZED_COUNT"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Release Plan"
              echo ""
              echo "No releasable Conventional Commit types detected in this merge window."
              echo ""
              echo "- Previous tag: ${CURRENT_TAG:-v0.0.0}"
              echo "- Commits analyzed: $ANALYZED_COUNT"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ensure release tag does not exist
        if: steps.plan.outputs.should_release == 'true'
        env:
          NEXT_TAG: ${{ steps.plan.outputs.next_tag }}
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/$NEXT_TAG" >/dev/null; then
            echo "Tag $NEXT_TAG already exists."
            exit 1
          fi

      - name: Configure git identity for release tag
        if: steps.plan.outputs.should_release == 'true'
        env:
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
        shell: bash
        run: |
          actor_name="${GITHUB_ACTOR_NAME:-github-actions[bot]}"
          if [ -n "${GITHUB_ACTOR_ID}" ] && [ -n "${GITHUB_ACTOR_NAME}" ]; then
            actor_email="${GITHUB_ACTOR_ID}+${GITHUB_ACTOR_NAME}@users.noreply.github.com"
          else
            actor_email="github-actions[bot]@users.noreply.github.com"
          fi

          git config user.name "$actor_name"
          git config user.email "$actor_email"

      - name: Create and push annotated tag
        if: steps.plan.outputs.should_release == 'true'
        env:
          NEXT_TAG: ${{ steps.plan.outputs.next_tag }}
        shell: bash
        run: |
          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"

      - name: Validate release automation token
        if: steps.plan.outputs.should_release == 'true'
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          if [ -z "$RELEASE_AUTOMATION_TOKEN" ]; then
            echo "Missing secret RELEASE_AUTOMATION_TOKEN. Configure a bot/App token with contents write access."
            exit 1
          fi

      - name: Create GitHub release
        if: steps.plan.outputs.should_release == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: process.env.RELEASE_TARGET,
              name: process.env.RELEASE_TAG,
              draft: false,
              prerelease: false,
              generate_release_notes: true
            });
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.next_tag }}
          RELEASE_TARGET: ${{ github.event.workflow_run.head_sha }}

  deploy-pages:
    needs: create-release
    if: needs.create-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate trusted release inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.create-release.outputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z. Got: $RELEASE_TAG"
            exit 1
          fi

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Release SHA must be a full lowercase Git commit SHA.'
            exit 1
          fi

      - name: Checkout released main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.create-release.outputs.release_sha }}

      - name: Verify tag provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.create-release.outputs.release_sha }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_sha="$(git rev-parse HEAD)"
          if [ "$tag_sha" != "$RELEASE_SHA" ] || [ "$head_sha" != "$RELEASE_SHA" ]; then
            echo 'Release tag does not resolve to the CI-gated main commit.'
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo 'Missing production deployment configuration.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        env:
          VITE_APP_VERSION: ${{ needs.create-release.outputs.release_tag }}
          VITE_APP_COMMIT_SHA: ${{ needs.create-release.outputs.release_sha }}
        run: npm run build

      - name: Deploy production to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          COMMIT_SHA: ${{ needs.create-release.outputs.release_sha }}
        run: |
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if npx wrangler pages deploy dist \
              --project-name "$CLOUDFLARE_PROJECT_NAME" \
              --branch main \
              --commit-hash "$COMMIT_SHA"; then
              exit 0
            fi

            if [ "$attempt" -eq "$attempts" ]; then
              echo "Pages production deploy failed after $attempts attempts."
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "Retrying Pages production deploy in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

  deploy-worker:
    needs: create-release
    if: needs.create-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate trusted release inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.create-release.outputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z. Got: $RELEASE_TAG"
            exit 1
          fi

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Release SHA must be a full lowercase Git commit SHA.'
            exit 1
          fi

      - name: Checkout released main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.create-release.outputs.release_sha }}

      - name: Verify tag provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.create-release.outputs.release_sha }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_sha="$(git rev-parse HEAD)"
          if [ "$tag_sha" != "$RELEASE_SHA" ] || [ "$head_sha" != "$RELEASE_SHA" ]; then
            echo 'Release tag does not resolve to the CI-gated main commit.'
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AIRPORT_IO_TOKEN: ${{ secrets.AIRPORT_IO_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$AIRPORT_IO_TOKEN" ]; then
            echo 'Missing worker production deployment configuration.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Set AirportDB token secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AIRPORT_IO_TOKEN: ${{ secrets.AIRPORT_IO_TOKEN }}
        run: |
          printf '%s' "$AIRPORT_IO_TOKEN" | npx wrangler secret put AIRPORTDB_API_TOKEN --config workers/metar-proxy/wrangler.jsonc

      - name: Deploy METAR Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if npx wrangler deploy --config workers/metar-proxy/wrangler.jsonc; then
              exit 0
            fi

            if [ "$attempt" -eq "$attempts" ]; then
              echo "Worker production deploy failed after $attempts attempts."
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "Retrying worker production deploy in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done
