name: Deploy Production

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    # This environment must require approval and restrict deployments to main.
    environment: production
    steps:
      - name: Validate trusted release inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z. Got: $RELEASE_TAG"
            exit 1
          fi

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Release SHA must be a full lowercase Git commit SHA.'
            exit 1
          fi

      - name: Checkout released main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: Verify tag provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_sha="$(git rev-parse HEAD)"
          if [ "$tag_sha" != "$RELEASE_SHA" ] || [ "$head_sha" != "$RELEASE_SHA" ]; then
            echo 'Release tag does not resolve to the CI-gated main commit.'
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo 'Missing production deployment configuration.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        env:
          VITE_APP_VERSION: ${{ inputs.release_tag }}
          VITE_APP_COMMIT_SHA: ${{ inputs.release_sha }}
        run: npm run build

      - name: Deploy production to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          COMMIT_SHA: ${{ inputs.release_sha }}
        run: |
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if npx wrangler pages deploy dist \
              --project-name "$CLOUDFLARE_PROJECT_NAME" \
              --branch main \
              --commit-hash "$COMMIT_SHA"; then
              exit 0
            fi

            if [ "$attempt" -eq "$attempts" ]; then
              echo "Pages production deploy failed after $attempts attempts."
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "Retrying pages production deploy in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done
