name: Deploy Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    # Configure this environment with required reviewers and a least-privilege
    # preview-only Cloudflare credential before enabling this workflow.
    environment: preview
    steps:
      - name: Resolve trusted pull request metadata
        id: pull-request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const pullRequests = context.payload.workflow_run.pull_requests;
            if (pullRequests.length !== 1) {
              core.setFailed('Expected the completed CI run to be associated with exactly one pull request.');
              return;
            }

            const pullRequest = pullRequests[0];
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number
            });

            if (
              data.base.ref !== 'main' ||
              data.head.repo?.fork ||
              ['dependabot[bot]', 'renovate[bot]'].includes(data.user.login) ||
              data.head.sha !== context.payload.workflow_run.head_sha
            ) {
              core.setFailed('The completed CI run is not an eligible same-repository pull request head.');
              return;
            }

            core.setOutput('number', String(data.number));
            core.setOutput('headRef', data.head.ref);
            core.setOutput('headSha', data.head.sha);

      - name: Checkout trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install trusted deployment tooling
        run: npm ci

      - name: Download CI-built preview artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Validate preview artifact
        shell: bash
        run: |
          if [ ! -f dist/index.html ]; then
            echo 'Preview artifact is missing dist/index.html.'
            exit 1
          fi

          if find dist -type l -print -quit | grep -q .; then
            echo 'Preview artifact must not contain symbolic links.'
            exit 1
          fi

      - name: Validate preview deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo 'Missing preview deployment configuration.'
            exit 1
          fi

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          PR_HEAD_REF: ${{ steps.pull-request.outputs.headRef }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.headSha }}
        run: |
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            set -o pipefail
            if npx wrangler pages deploy dist \
              --project-name "$CLOUDFLARE_PROJECT_NAME" \
              --branch "$PR_HEAD_REF" \
              --commit-hash "$PR_HEAD_SHA" \
              | tee deploy-output.txt; then
              break
            fi

            if [ "$attempt" -eq "$attempts" ]; then
              echo "Pages preview deploy failed after $attempts attempts."
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "Retrying pages preview deploy in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

          preview_deployment_url="$(grep -Eo 'https://[^ ]+\.pages\.dev[^ ]*' deploy-output.txt | head -n1)"
          preview_branch_url="$(grep -Eo 'https://[^ ]+\.pages\.dev[^ ]*' deploy-output.txt | tail -n1)"
          if [ -z "$preview_deployment_url" ]; then
            echo 'Could not extract preview URL from wrangler output.'
            exit 1
          fi

          echo "preview_url=$preview_branch_url" >> "$GITHUB_OUTPUT"
          echo "preview_deployment_url=$preview_deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview cache behavior
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_deployment_url }}
        run: node scripts/verify-preview-cache.mjs "$PREVIEW_URL"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run preview UI E2E tests
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_deployment_url }}
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-ui-artifacts-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

      - name: Post or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PULL_NUMBER: ${{ steps.pull-request.outputs.number }}
        with:
          script: |
            const marker = '<!-- runway-picker-preview -->';
            const body = `${marker}\nPreview deployment ready: ${process.env.PREVIEW_URL}`;
            const issueNumber = Number.parseInt(process.env.PULL_NUMBER, 10);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
